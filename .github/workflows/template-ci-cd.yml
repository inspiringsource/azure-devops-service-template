# This workflow is disabled by default.
# It is intended as a template/example.
# To enable it, replace 'workflow_dispatch' with:
#   push:
#     branches: [ "main" ]
#   pull_request:

name: CI-CD

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Log in to GitHub Container Registry
        if: false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Tag latest image
        if: false
        run: docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      - name: Push SHA image to GHCR
        if: false
        run: echo "Disabled by default for template usage. Enable GHCR publishing before use."

      - name: Push latest image to GHCR
        if: false
        run: echo "Disabled by default for template usage. Enable GHCR publishing before use."

      # Optional Azure deployment steps can be enabled after GHCR publishing.
      # Keep Azure credentials out of normal CI so pull requests and standard
      # repository validation succeed without cloud access.
