name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build TypeScript
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: service-starter-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke-test container health
        env:
          IMAGE_TAG: service-starter-ci:${{ github.sha }}
        run: |
          docker run --detach --name service-starter-smoke --publish 127.0.0.1:3000:3000 "$IMAGE_TAG"
          trap 'docker rm --force service-starter-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' service-starter-smoke)"
            if [ "$status" = healthy ]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs service-starter-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs service-starter-smoke
          exit 1
