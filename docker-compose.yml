services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_ENV: docker
      APP_VERSION: 1.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:${process.env.PORT || 3000}/health`).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
